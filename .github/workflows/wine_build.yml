name: MacGaming Runtime - Wine Build

on:
  push:
    paths:
      - 'runtime/**'
      - '.github/workflows/wine_build.yml'
  pull_request:

jobs:
  build-wine:
    name: Build Wine for macOS (ARM64 WoW64)
    runs-on: macos-latest
    
    steps:
      - name: Checkout MacGaming
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          brew install bison flex mingw-w64 pkg-config gettext gnutls

      - name: Configure Wine (ARM64 WoW64)
        run: |
          cd runtime/wine
          ./configure --enable-archs=arm64,x86_64 --without-x --without-oss --without-alsa

      - name: Build Wine
        run: |
          cd runtime/wine
          make -j$(sysctl -n hw.ncpu)
