name: Apple Gaming Compatibility Runtime CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly upstream sync verification every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
        config: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Apple Silicon Environment
        run: |
          echo "Architecture: $(uname -m)"
          echo "macOS Version: $(sw_vers -productVersion)"
          echo "Xcode Version: $(xcodebuild -version)"

      - name: Validate Modular Wine Patches
        run: |
          chmod +x runtime/scripts/*.sh runtime/tests/*.sh
          ./runtime/scripts/apply-patches.sh

      - name: Build MacGaming Application & Runtime Modules
        run: |
          cd apps/MacGaming
          if [ "${{ matrix.config }}" = "Release" ]; then
            swift build -c release
          else
            swift build -c debug
          fi

      - name: Run Compatibility Test Suite
        run: |
          ./runtime/tests/run-tests.sh

      - name: Package Release Artifacts
        if: matrix.config == 'Release'
        run: |
          mkdir -p dist
          tar -czf dist/mac-gaming-runtime-arm64.tar.gz -C apps/MacGaming/.build/release MacGaming
          echo "Packaged runtime artifact to dist/mac-gaming-runtime-arm64.tar.gz"

      - name: Upload Artifact
        if: matrix.config == 'Release' && matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: mac-gaming-runtime-arm64
          path: dist/mac-gaming-runtime-arm64.tar.gz
