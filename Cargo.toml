[workspace]
members = [
    "crates/core",
    "crates/scanner",
    "crates/analyzer",
    "crates/prefix",
    "crates/profiles",
    "crates/bridge",
    "apps/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Porta & Forge Open Source Community"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.38", features = ["full"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
walkdir = "2.5"
regex = "1.10"
goblin = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
colored = "2.1"
tabled = { version = "0.15", features = ["derive"] }
tempfile = "3.10"
